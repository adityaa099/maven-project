name: Maven build

on:
    push:
        branches: 
            - main

    pull_request:
        branches: 
            - main

jobs:

    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '17'

            - name: Build war
              run: mvn clean package

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                    name: demo-war
                    path: target/*.war